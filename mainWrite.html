            <li class="nav-item">

                class="nav-link"

              >
            </li>
            <li class="nav-item">
              <a
                id="nav-sub2"
                class="nav-link"
                style="color: #6e6d7a"
                href="studentThink.html"
                >의견수렴함</a
              >
            </li>
            <li class="nav-item">
              <a
                id="nav-sub3"
                class="nav-link"
                style="color: #6e6d7a"
                href="meeting.html"

              >
            </li>
            <li class="nav-item">

                    type="button"
                    id="submit3"
                    value="로그아웃"
                    onclick="gotoMain()"
                  />
                </form>
              </div>
            </div>
          </ul>
        </div>
        <div class="frame1">
          <div class="text-frame1">
            <p>민원 신청</p>
          </div>
          <div class="frame2">
            <div class="btn-group">
              <button id="dropdownButton" type="button" class="btn">
                분야
              </button>
              <!--class="btn" css에서 따로 색 설정해야됨 -->
              <button
                type="button"
                class="btn dropdown-toggle dropdown-toggle-split"
                data-bs-toggle="dropdown"
                aria-expanded="false"
              >
                <span class="visually-hidden">Toggle Dropdown</span>
              </button>
              <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="#">보건</a></li>
                <li><a class="dropdown-item" href="#">교육</a></li>
                <li><a class="dropdown-item" href="#">시설</a></li>
                <li><a class="dropdown-item" href="#">행정</a></li>
                <!--더 추가 가능!!!!-->
              </ul>
            </div>
            <div class="frame3">
              <input
                type="text"
                class="text-frame2"
                placeholder="제목을 입력하세요."
              />
              <div class="icon"><img src="./img/icon.png" /></div>
            </div>
          </div>
        </div>
        <div class="frame4">
          <div class="text-frame3">
            <textarea
              type="text"
              class="text-1"
              placeholder="내용을 입력하세요."
            ></textarea>
          </div>
        </div>
        <div class="frame5">

            <div class="radius-text1">

                <input type="submit" value="제출하기" class="submit1" />

            </div>
          </div>
          <div class="radius-frame3">
            <div class="radius-text2">
              <input
                type="button"
                value="돌아가기"
                class="backbtn"
                onclick="location.href='main.html'"
              />
            </div>
          </div>
        </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script type="text/javascript" src="/js/bootstrap.js"></script>
