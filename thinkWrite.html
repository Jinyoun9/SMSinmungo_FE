<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>thinkWrite</title>
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/thinkWrite.css" />
  </head>
  <body>
    <div class="container">
      <div class="element">
        <div class="navigation">
          <ul class="nav nav-tabs">
            <li class="nav-item">
              <a
                id="nav-title"
                class="nav-link active"
                aria-current="page"
                style="color: #4582d0"
                href="#"
                >상명신문고</a
              >
            </li>
            <li class="nav-item">
              <a
                id="nav-sub1"
                class="nav-link"
                style="color: #6e6d7a"
                href="main.html"
                >불편사항</a
              >
            </li>
            <li class="nav-item">
              <a
                id="nav-sub2"
                class="nav-link"
                style="color: #4b4b56"
                href="studentThink.html"
                >의견수렴함</a
              >
            </li>
            <li class="nav-item">
              <a
                id="nav-sub3"
                class="nav-link"
                style="color: #6e6d7a"
                href="meeting.html"
                >간담회</a
              >
            </li>
            <li class="nav-item">
              <a
                id="nav-sub4"
                class="nav-link"
                style="color: #6e6d7a"
                href="myPage.html"
                >마이페이지</a
              >
            </li>
            <div class="nav-radius1">
              <div class="nav-textframe5"></div>
            </div>
            <div class="nav-radius2">
              <div class="nav-textframe6"></div>
            </div>
            <div class="nav-radius3">
              <div class="nav-textframe7">
                <form>
                  <input
                    type="button"
                    id="submit3"
                    value="로그아웃"
                    onclick="gotoMain()"
                  />
                </form>
              </div>
            </div>
          </ul>
        </div>
        <div class="frame1">
          <div class="text-frame1">
            <p>의견수렴함</p>
          </div>
          <div class="frame2">
            <div class="frame3">
              <input
                type="text"
                class="text-frame2"
                placeholder="제목을 입력하세요."
              />
              <div class="icon"><img src="./img/icon.png" /></div>
            </div>
          </div>
        </div>
        <div class="frame4">
          <div class="text-frame3">
            <textarea
              type="text"
              class="text-1"
              placeholder="내용을 입력하세요."
            ></textarea>
          </div>
        </div>
        <div class="frame5">
          <div class="radius-frame2">
            <div class="radius-text1">
              <form>
                <input type="submit" value="제출하기" class="submit1" />
              </form>
            </div>
          </div>
          <div class="radius-frame3">
            <div class="radius-text2">
              <input
                type="button"
                value="돌아가기"
                class="backbtn"
                onclick="location.href='studentThink.html'"
              />
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script type="text/javascript" src="/js/bootstrap.js"></script>
    <script type="text/javascript" src="/js/bootstrap.bundle.min.js"></script>
    <script type="text/javascript" src="/js/thinkWrite.js"></script>
  </body>
</html>
