<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>index</title>
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/index.css" />
  </head>
  <body>
    <div class="container">
      <div class="element">
        <div class="frame1">
          <div class="text-frame1">상명신문고</div>
        </div>
        <div class="frame2">
          <div class="imgframe1">
            <img src="img/div.png" width="350px" height="350px" />
          </div>
          <div class="frame3">
            <div class="text-frame2">반가워요!</div>
            <div class="text-frame3">자신의 의견을 마음껏 표출해보세요!</div>
            <div class="signUpframe">
              <div class="text-frame4">
                <form>
                  <input
                    type="button"
                    id="submit1"
                    value="회원가입"
                    onclick="gosignUp()"
                  />
                </form>
              </div>
            </div>
            <div class="loginframe">
              <div class="text-frame4">
                <form>
                  <input
                    type="button"
                    id="submit2"
                    value="로그인"
                    onclick="gologin()"
                  />
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script type="text/javascript" src="/js/bootstrap.js"></script>
    <script type="text/javascript" src="/js/index.js"></script>
  </body>
</html>
